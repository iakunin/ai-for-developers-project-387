# Generated from console command `opencode github install`
# Reacts on comments with `/oc` or `/opencode` or mentions `@opencode-agent`
name: opencode-interactions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Serialise runs per issue/PR. Several `/oc` replies posted in a burst used to
# start overlapping jobs that all committed to the same branch; whichever
# finished second failed its `git push` with "the remote contains work that you
# do not have locally". Queue them instead of cancelling: every request the
# author made should still be answered.
concurrency:
  group: opencode-interactions-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      contains(format(' {0} ', github.event.comment.body), ' /oc ') ||                                                                                     
      contains(format(' {0} ', github.event.comment.body), ' /opencode ') ||                                                                               
      contains(format(' {0} ', github.event.comment.body), ' @opencode-agent ')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Acknowledge the comment with 👀
        uses: actions/github-script@v7
        with:
          script: |
            const comment_id = context.payload.comment.id;
            if (context.eventName === 'pull_request_review_comment') {
              await github.rest.reactions.createForPullRequestReviewComment({
                ...context.repo, comment_id, content: 'eyes',
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                ...context.repo, comment_id, content: 'eyes',
              });
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the agent may rebase or amend on the PR branch, and a
          # shallow clone leaves it without the commits such a rewrite needs.
          fetch-depth: 0
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          # The action re-validates the trigger phrase itself and exits 1 on a
          # mismatch, so this must list every phrase the job's `if:` accepts.
          mentions: /opencode,/oc,@opencode-agent
