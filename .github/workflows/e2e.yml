name: e2e

on:
  push:
    branches:
      - '**'
    paths:
      - 'code/**'
      - 'api-contract/openapi/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/e2e.yml'

jobs:
  scenarios:
    name: Booking scenarios in a real browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/e2e

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/e2e/package-lock.json

      - name: Install dependencies
        run: make install-ci

      - name: Install Chromium
        run: make browsers

      - name: Type check the tests
        run: make typecheck

      # `make test` depends on `image` anyway. Keeping the build as its own step keeps the
      # slowest part of the job — and its failures — readable in the workflow log.
      - name: Build the application image
        run: make image

      - name: Run the scenarios
        run: make test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: code/e2e/playwright-report/
          retention-days: 7
